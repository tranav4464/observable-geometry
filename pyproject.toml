[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "observable-geometry"
version = "0.1.3.dev0"
description = "Auditable nominal source-pattern distinguishability for EEG forward models"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "scipy>=1.11"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
observable-geometry = "observable_geometry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reviewer_handoff", "archive"]
