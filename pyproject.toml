[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "observable-geometry"
version = "0.1.3.dev2"
description = "Auditable nominal source-pattern distinguishability for EEG forward models"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "scipy>=1.11"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8"]
research-audit = ["h5py>=3.10", "mne>=1.7", "nibabel>=5.2"]
web = ["streamlit>=1.40", "pandas>=2.0"]
figures = ["matplotlib>=3.8", "pandas>=2.0", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.29"]

[project.scripts]
observable-geometry = "observable_geometry.cli:main"
observable-geometry-web = "observable_geometry.web_launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reviewer_handoff", "archive"]
